name: Gerar APK

# Roda a cada envio de código para a branch main, ou manualmente pela aba Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo KEYSTORE_BASE64 não configurado. O APK será assinado com chave temporária e atualizações exigirão desinstalar o app."
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk "BatteryAlert-v1.${{ github.run_number }}.apk"

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Battery Alert v1.${{ github.run_number }}
          body: |
            Baixe o arquivo **BatteryAlert-v1.${{ github.run_number }}.apk** abaixo e abra no celular Android para instalar.
          files: BatteryAlert-v1.${{ github.run_number }}.apk
          make_latest: true
